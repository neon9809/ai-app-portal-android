<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是安全区适配的前提；不禁止缩放，双指缩放的误触由 touch-action 控制 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9fafd" />
    <!-- 首帧前落地主题，避免深色模式先闪一下浅色。键名与 src/shared/theme.ts 保持一致。
         这里的色值只用于浏览器状态栏底色，首帧后由 theme.ts 从 token 重新写入。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portal-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1118' : '#f9fafd')
        } catch (error) {
          // 存储不可用：保持默认浅色
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <!-- 登录态作用域：App UI 与 Admin UI 各自独立保存会话，同源部署 / 预览下也不会互相串号。
         admin.html 声明 content="admin"；该值由 src/shared/track.ts 读取，决定 auth 的 storageKey，不要删除或改错。 -->
    <meta name="ui-scope" content="app" />
    <!-- 初始文档标题保持中性：应用未命名时 APP_NAME 可能还是平台注入的占位值（如项目 ID），
         不能直接当标题暴露。页面用 usePageTitle() 声明标题后 document.title 会随之更新，
         没有声明时回到 src/shared/config/app.ts 的 DOC_TITLE_FALLBACK（与这里保持一致）。 -->
    <title>AI应用门户</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      壳桥接 SDK（/sdk/capsule.js）不在这里静态引入：浏览器 / 预览没有它，直接写会 404。
      它由构建期插件（vite.config.ts 的 capsuleSdkInjectPlugin）注入进产物 HTML，只在壳内可达，
      不要手写 <script> 到这里。
      预览里加载不到时桥接层回落到 mock（见 src/shared/bridge/loader.ts）。
    -->
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
